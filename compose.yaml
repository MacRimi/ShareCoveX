services:
  sharecovex:
    image: ghcr.io/macrimi/sharecovex:latest
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SHARECOVEX_ADMIN_PASSWORD: ${SHARECOVEX_ADMIN_PASSWORD:?Set a strong password}
    ports:
      - "127.0.0.1:8080:8080/tcp"
      - "445:445/tcp"
      - "111:111/tcp"
      - "111:111/udp"
      - "2049:2049/tcp"
      - "20048:20048/tcp"
    volumes:
      - ./config:/config
      - ${SHARECOVEX_HOST_PATH_MEDIA:?Set an absolute host path}:/shares/media
      # Add as many host paths as needed, each with a unique /shares/<id> target:
      # - /srv/shares/backups:/shares/backups
