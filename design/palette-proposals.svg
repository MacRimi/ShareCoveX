<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">Propuestas de color para ShareCoveX</title>
  <desc id="desc">Cuatro sistemas visuales coordinados para la interfaz, el logo y la cabecera del repositorio.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dy="10" stdDeviation="14" flood-opacity=".12"/></filter>
    <style>
      .name{font:800 28px 'Avenir Next','Trebuchet MS',sans-serif;letter-spacing:-1px}.meta{font:13px Menlo,monospace;letter-spacing:1.5px}.label{font:700 15px 'Avenir Next','Trebuchet MS',sans-serif}.small{font:12px 'Avenir Next','Trebuchet MS',sans-serif}.mono{font:12px Menlo,monospace}.hero{font:800 32px 'Avenir Next','Trebuchet MS',sans-serif;letter-spacing:-1.5px}.white{fill:#fff}.swatch{stroke:#fff;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="1160" fill="#f2f1eb"/>
  <text x="70" y="70" fill="#172c2b" font-family="Avenir Next,Trebuchet MS,sans-serif" font-size="34" font-weight="800">ShareCoveX · exploración de color</text>
  <text x="70" y="102" fill="#60706d" font-family="Menlo,monospace" font-size="14">INTERFAZ + LOGO + IMAGEN DEL REPOSITORIO</text>

  <!-- A -->
  <g transform="translate(70 145)" filter="url(#shadow)">
    <rect width="710" height="430" rx="25" fill="#f8f5ea" stroke="#b8d4cd"/>
    <rect width="710" height="112" rx="25" fill="#103f3d"/><rect y="87" width="710" height="25" fill="#103f3d"/>
    <rect x="28" y="25" width="58" height="58" rx="17" fill="#f0ad4e"/><text x="45" y="62" class="name" fill="#103f3d">SX</text>
    <text x="105" y="54" class="hero white">ShareCoveX<tspan fill="#f0ad4e">.</tspan></text><text x="107" y="78" class="meta" fill="#bfe9de">COASTAL STORAGE</text>
    <text x="30" y="156" class="meta" fill="#08786c">A · CALA ATLÁNTICA</text><text x="30" y="190" class="name" fill="#103f3d">Serena, confiable y cercana</text>
    <rect x="30" y="218" width="650" height="86" rx="15" fill="#e7f2ec" stroke="#b8d4cd"/>
    <text x="50" y="248" class="label" fill="#103f3d">/shares/data</text><text x="50" y="273" class="mono" fill="#57736d">SMB + NFS · Compatible con escritura</text>
    <rect x="567" y="235" width="87" height="42" rx="10" fill="#103f3d"/><text x="587" y="261" class="label white">Editar</text>
    <circle cx="42" cy="350" r="16" fill="#103f3d" class="swatch"/><circle cx="82" cy="350" r="16" fill="#08786c" class="swatch"/><circle cx="122" cy="350" r="16" fill="#b8d4cd" class="swatch"/><circle cx="162" cy="350" r="16" fill="#f8f5ea" class="swatch"/><circle cx="202" cy="350" r="16" fill="#f0ad4e" class="swatch"/>
    <text x="30" y="395" class="small" fill="#57736d">Evolución natural de la identidad actual, más cálida y marina.</text>
  </g>

  <!-- B -->
  <g transform="translate(820 145)" filter="url(#shadow)">
    <rect width="710" height="430" rx="25" fill="#f4f7f8" stroke="#bdd1db"/>
    <rect width="710" height="112" rx="25" fill="#15324a"/><rect y="87" width="710" height="25" fill="#15324a"/>
    <rect x="28" y="25" width="58" height="58" rx="17" fill="#56d7c4"/><text x="45" y="62" class="name" fill="#15324a">SX</text>
    <text x="105" y="54" class="hero white">ShareCoveX<tspan fill="#56d7c4">.</tspan></text><text x="107" y="78" class="meta" fill="#c8e5ef">NETWORK APPLIANCE</text>
    <text x="30" y="156" class="meta" fill="#167d91">B · FIORDO DIGITAL</text><text x="30" y="190" class="name" fill="#15324a">Precisa, técnica y moderna</text>
    <rect x="30" y="218" width="650" height="86" rx="15" fill="#e6f0f3" stroke="#bdd1db"/>
    <text x="50" y="248" class="label" fill="#15324a">/shares/data</text><text x="50" y="273" class="mono" fill="#536d7b">SMB + NFS · Compatible con escritura</text>
    <rect x="567" y="235" width="87" height="42" rx="10" fill="#15324a"/><text x="587" y="261" class="label white">Editar</text>
    <circle cx="42" cy="350" r="16" fill="#15324a" class="swatch"/><circle cx="82" cy="350" r="16" fill="#167d91" class="swatch"/><circle cx="122" cy="350" r="16" fill="#bdd1db" class="swatch"/><circle cx="162" cy="350" r="16" fill="#f4f7f8" class="swatch"/><circle cx="202" cy="350" r="16" fill="#56d7c4" class="swatch"/>
    <text x="30" y="395" class="small" fill="#536d7b">Sensación de appliance profesional sin caer en el azul corporativo genérico.</text>
  </g>

  <!-- C -->
  <g transform="translate(70 620)" filter="url(#shadow)">
    <rect width="710" height="430" rx="25" fill="#fbf5eb" stroke="#d9c8b8"/>
    <rect width="710" height="112" rx="25" fill="#3d302d"/><rect y="87" width="710" height="25" fill="#3d302d"/>
    <rect x="28" y="25" width="58" height="58" rx="17" fill="#e96f45"/><text x="45" y="62" class="name" fill="#3d302d">SX</text>
    <text x="105" y="54" class="hero white">ShareCoveX<tspan fill="#e96f45">.</tspan></text><text x="107" y="78" class="meta" fill="#eedbc7">FILES WITH A HOME</text>
    <text x="30" y="156" class="meta" fill="#a24e35">C · TERRACOTA EDITORIAL</text><text x="30" y="190" class="name" fill="#3d302d">Humana, cálida y memorable</text>
    <rect x="30" y="218" width="650" height="86" rx="15" fill="#f3e7d9" stroke="#d9c8b8"/>
    <text x="50" y="248" class="label" fill="#3d302d">/shares/data</text><text x="50" y="273" class="mono" fill="#77645e">SMB + NFS · Compatible con escritura</text>
    <rect x="567" y="235" width="87" height="42" rx="10" fill="#3d302d"/><text x="587" y="261" class="label white">Editar</text>
    <circle cx="42" cy="350" r="16" fill="#3d302d" class="swatch"/><circle cx="82" cy="350" r="16" fill="#a24e35" class="swatch"/><circle cx="122" cy="350" r="16" fill="#d9c8b8" class="swatch"/><circle cx="162" cy="350" r="16" fill="#fbf5eb" class="swatch"/><circle cx="202" cy="350" r="16" fill="#e96f45" class="swatch"/>
    <text x="30" y="395" class="small" fill="#77645e">La más diferencial; convierte una herramienta técnica en un producto amable.</text>
  </g>

  <!-- D -->
  <g transform="translate(820 620)" filter="url(#shadow)">
    <rect width="710" height="430" rx="25" fill="#f3f5f2" stroke="#c8d0cb"/>
    <rect width="710" height="112" rx="25" fill="#202927"/><rect y="87" width="710" height="25" fill="#202927"/>
    <rect x="28" y="25" width="58" height="58" rx="17" fill="#a7e05f"/><text x="45" y="62" class="name" fill="#202927">SX</text>
    <text x="105" y="54" class="hero white">ShareCoveX<tspan fill="#a7e05f">.</tspan></text><text x="107" y="78" class="meta" fill="#d4e2dc">SHARE WITHOUT THE EXTRA LAYER</text>
    <text x="30" y="156" class="meta" fill="#007f79">D · GRAFITO SIGNAL</text><text x="30" y="190" class="name" fill="#202927">Sobria, potente y reconocible</text>
    <rect x="30" y="218" width="650" height="86" rx="15" fill="#e5ece8" stroke="#c8d0cb"/>
    <text x="50" y="248" class="label" fill="#202927">/shares/data</text><text x="50" y="273" class="mono" fill="#596a65">SMB + NFS · Compatible con escritura</text>
    <rect x="567" y="235" width="87" height="42" rx="10" fill="#202927"/><text x="587" y="261" class="label white">Editar</text>
    <circle cx="42" cy="350" r="16" fill="#202927" class="swatch"/><circle cx="82" cy="350" r="16" fill="#007f79" class="swatch"/><circle cx="122" cy="350" r="16" fill="#c8d0cb" class="swatch"/><circle cx="162" cy="350" r="16" fill="#f3f5f2" class="swatch"/><circle cx="202" cy="350" r="16" fill="#a7e05f" class="swatch"/>
    <text x="30" y="395" class="small" fill="#596a65">Más contundente y tecnológica; el lima aporta una firma visual propia.</text>
  </g>
  <text x="70" y="1110" fill="#60706d" font-family="Avenir Next,Trebuchet MS,sans-serif" font-size="16">El color de cabecera, la marca SX, los estados, botones y fondo se trasladará también al SVG principal del README.</text>
</svg>
